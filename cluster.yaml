apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: cicd-cluster
  region: eu-west-3
  version: "1.36"

availabilityZones: ["eu-west-3a", "eu-west-3b"]

iam:
  withOIDC: true

managedNodeGroups:
  - name: cicd-nodegroup
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 1
    maxSize: 3
    volumeSize: 20
    privateNetworking: true