name: Deploy temperature on EKS

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  AWS_REGION: eu-west-3
  ECR_REPOSITORY: temp-converter-api
  EKS_CLUSTER: my-eks-cluster
  K8S_NAMESPACE: temp-app

jobs:
  CI: 
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.12'
      
      - name: Install dependencies and security tools
        run:  |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8
          pip install pytest
          pip install bandit
          pip install pip-audit

      - name: Lint with flake8
        run:  |
           flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
           flake8 . --count --max-complexity=10 --max-line-length=127 --statistics 
      
      - name: Python test
        run:  |
          pytest
      
      - name: SAST scan
        run: bandit -r . -lll
      
      - name: Run dependency scan
        run: pip-audit -r requirements.txt

  build-and-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: CI
    permissions:
      id-token: write
      contents: read # Fixed: Required to check out repository code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::988079434395:role/temperature_app_ecr
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Fixed: Combined Build, Scan, and Push steps so variables stay in scope
      - name: Build, Scan, and Push Image
        env: 
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ env.SHORT_SHA }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  Deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-push
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest

    steps:
    - name: Set Short SHA
      run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
         role-to-assume: arn:aws:iam::988079434395:role/temperature_app_eks # Fixed: Adjusted name to match your active IAM Role
         aws-region: ${{ env.AWS_REGION }}

    - name: update kubeconfig
      run: |
        aws eks update-kubeconfig \
          --region $AWS_REGION \
          --name $EKS_CLUSTER
    
    # Fixed: Corrected the image string assembly to use registry URI + Repo + Tag directly
    - name: Deploy to EKS
      run: |
        ECR_REGISTRY="988079434395.dkr.ecr.$AWS_REGION.amazonaws.com"
        
        kubectl set image deployment/temp-app \
          temp-app=$ECR_REGISTRY/$ECR_REPOSITORY:${{ env.SHORT_SHA }} \
          -n $K8S_NAMESPACE
          
        kubectl rollout status deployment/temp-app \
          -n $K8S_NAMESPACE \
          --timeout=180s
