apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: temp-app-ingress
  namespace: temp-app
  annotations:
    # Optional: Use annotations if your controller doesn't support ingressClassName
    # kubernetes.io/ingress.class: "nginx"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: temp-app-service
            port:
              number: 80
